[package]
name = "reel"
version = "0.1.0"
edition = "2024"
description = "Videos from TypeScript scene files, drawn on the GPU"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5.17"
fast_image_resize = "6.1.0"
glob = "0.3"
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
parley = "0.12.0"
png = "0.18.1"
pollster = "1.0.1"
rquickjs = { version = "0.14", features = ["loader"] }
serde_json = "1.0.154"
swash = "0.2.10"
swc_common = "26"
swc_ts_fast_strip = "59"
taffy = "0.15.0"
turbojpeg = { version = "1.5.1", default-features = false, features = ["pkg-config"] }
naga = { version = "30", features = ["wgsl-in"] }
wgpu = "30.0.1"
winit = "0.30"

[profile.release]
debug = 1
